
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/wordrush/assets/favicon-BS81fjEU.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>WordRush</title>

    

  <script type="module" crossorigin src="/wordrush/assets/index-DlkxcfKo.js"></script>
  <link rel="stylesheet" crossorigin href="/wordrush/assets/index-BCvZZ9Tx.css">
</head>

<body>

    <header>

        <h1>WORDRUSH</h1>

        <button id="newGameButton">
            NEW GAME
        </button>

        <button id="hintButton">
            HINT
        </button>

    </header>


    <main>

        <div id="message"></div>


        <!--
            Hidden input used to activate
            the phone's system keyboard
        -->

        <input
            type="text"
            id="mobileInput"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
        >


        <div id="board"></div>

        <div id="keyboard"></div>

    </main>


    <!-- GAME OVER / WIN POPUP -->

    <div id="gameOverModal" class="modal">

    <div id="confetti"></div>

    <div class="modal-content">

        <div class="modal-icon" id="modalIcon">
            🎉
        </div>

        <h2 id="modalTitle">
            YOU WON!
        </h2>

        <p>
            The word was:
        </p>

        <h3 id="answerWord"></h3>

        <div class="modal-buttons">

            <button id="modalNewGame">
                NEW GAME
            </button>

            <button id="modalExit">
                EXIT
            </button>

        </div>

    </div>

</div>



</body>

</html>
