<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WordRush</title>


  <script type="module" crossorigin src="/wordrush/assets/index-BZDIOnn9.js"></script>
  <link rel="stylesheet" crossorigin href="/wordrush/assets/index-BE6ECAbv.css">
</head>

<body>

    <header>

        <h1>WORDRUSH</h1>

        <button id="newGameButton">
            NEW GAME
        </button>

        <button id="hintButton">
            HINT
        </button>

    </header>


    <main>

        <div id="message"></div>

        <div id="board"></div>

        <div id="keyboard"></div>

    </main>


    <!-- GAME OVER POPUP -->

    <div id="gameOverModal" class="modal">

        <div class="modal-content">

            <h2 id="modalTitle">
                GAME OVER
            </h2>

            <p>
                The word was:
            </p>

            <h3 id="answerWord"></h3>

            <div class="modal-buttons">

                <button id="modalNewGame">
                    NEW GAME
                </button>

                <button id="modalExit">
                    EXIT
                </button>

            </div>

        </div>

    </div>



</body>

</html>
