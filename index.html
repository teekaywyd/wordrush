
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>WordRush</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <header>

        <h1>WORDRUSH</h1>

        <button id="newGameButton">
            NEW GAME
        </button>

        <button id="hintButton">
            HINT
        </button>

    </header>


    <main>

        <div id="message"></div>


        <!--
            Hidden input used to activate
            the phone's system keyboard
        -->

        <input
            type="text"
            id="mobileInput"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
        >


        <div id="board"></div>

        <div id="keyboard"></div>

    </main>


    <!-- GAME OVER / WIN POPUP -->

    <div id="gameOverModal" class="modal">

        <div class="modal-content">

            <h2 id="modalTitle">
                GAME OVER
            </h2>

            <p>
                The word was:
            </p>

            <h3 id="answerWord"></h3>

            <div class="modal-buttons">

                <button id="modalNewGame">
                    NEW GAME
                </button>

                <button id="modalExit">
                    EXIT
                </button>

            </div>

        </div>

    </div>


    <script type="module" src="js/main.js"></script>

</body>

</html>
